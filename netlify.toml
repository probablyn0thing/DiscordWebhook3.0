
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "nft"

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/start"
  to = "/.netlify/functions/start"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/health"
  status = 200
